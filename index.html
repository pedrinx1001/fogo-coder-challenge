<style>

.brand{display:flex;align-items:center;gap:8px}.brand svg{color:var(--at)}

.scroll{max-height:310px;overflow:auto}.al{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font:inherit;color:inherit;padding:8px;border-left:3px solid;background:var(--bg);margin-bottom:6px;cursor:pointer;width:100%;text-align:left;border-top:0;border-right:0;border-bottom:0}

tr.go{cursor:pointer}tr.go:hover td{background:var(--s2)}.tg{display:inline-flex;gap:4px;align-items:center;padding:1px 7px;border:1px solid;border-radius:3px;font-size:12px;white-space:nowrap}
.l0{color:var(--ok)}.l1{color:var(--at)}.l2{color:var(--hi)}.l3{color:var(--cr)}.sec{margin-top:10px}.sec h3{border-bottom:1px solid var(--ln);padding-bottom:3px}.kv{display:grid;grid-template-columns:120px 1fr;gap:2px 8px;font-size:13px}.kv dt{color:var(--mu)}.kv dd{margin:0;word-break:break-word}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.frm label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.frm .full{grid-column:1/-1;display:flex;gap:8px}.tb{max-height:300px;overflow:auto;margin-top:10px}.err{color:var(--cr);min-height:18px}
.hm td{padding:0;width:3.4%;height:20px;border:1px solid var(--bg);font-size:10px;text-align:center}.note{color:var(--mu);font-size:12px;margin:8px 0 0}

<script>
'use strict';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- ícones vetoriais (24×24, traço 1,8) ----------
const P={radar:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 12l5-5"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',balanca:'<path d="M12 4v16M7 20h10M5 8h14M5 8l-3 7h6zM19 8l-3 7h6z"/>',auto:'<rect x="4" y="9" width="16" height="8" rx="2"/><circle cx="8" cy="17" r="1.5"/><circle cx="16" cy="17" r="1.5"/><path d="M12 3v3M8 5l1 2M16 5l-1 2"/>',cancela:'<path d="M3 19h6M6 19V9h15M10 9v4M14 9v4M18 9v4"/>',transp:'<path d="M5 17v-6l2-5h10l2 5v6M3 17h18M5 17v2M19 17v2"/><circle cx="8" cy="13" r="1"/><circle cx="16" cy="13" r="1"/>',totem:'<rect x="6" y="3" width="12" height="18" rx="1"/><path d="M10 17V8h3a2 2 0 0 1 0 4h-3"/>',patinete:'<circle cx="6" cy="19" r="2"/><circle cx="18" cy="19" r="2"/><path d="M8 19h8l-3-14h3M9 5h4"/>',moto:'<circle cx="6" cy="16" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 16h5l3-6h-3M12 10l2 6M8 8h3"/>',viatura:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/>',agente:'<circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>',
 alerta:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',ok:'<path d="M5 12l5 5 9-10"/>',manut:'<path d="M14 6a4 4 0 0 0 4 4l-9 9a2 2 0 0 1-3-3l9-9a4 4 0 0 0-1-1z"/>',off:'<path d="M9 6v12M15 6v12"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',nova:'<circle cx="12" cy="12" r="4"/>',busca:'<circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',painel:'<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="5"/><rect x="13" y="10" width="8" height="11"/><rect x="3" y="13" width="8" height="8"/>',lista:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',graf:'<path d="M4 20V4M4 20h16M8 16l4-5 3 3 5-7"/>',filtro:'<path d="M4 5h16l-6 8v6l-4-2v-4z"/>',pin:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'};
const ic=(n,s=16)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
// ---------- domínio ----------
const BA=[['Centro',-22.2139,-49.9456],['Zona Norte',-22.185,-49.9456],['Zona Sul',-22.245,-49.9456],['Zona Leste',-22.2139,-49.89],['Zona Oeste',-22.2139,-50.001]];
const ORG=['Trânsito','Guarda Municipal','Polícia Militar','Mobilidade urbana'],CARGOS=['Agente de trânsito','Guarda municipal','Policial militar'];
// situação: [rótulo, cor, ícone de estado, disponível?]
const SIT={oper:['Operacional','var(--ok)','ok'],mau:['Mau funcionamento','var(--hi)','alerta'],manut:['Em manutenção','var(--in)','manut'],desat:['Desativado','var(--off)','off'],furt:['Furtado','var(--cr)','x'],nova:['Ainda não instalado','var(--off)','nova']};
const T={radar:['Radar de fiscalização','Finalidade (velocidade, semáforo, conversão)','Velocidade máx. (km/h)','Trânsito'],camera:['Câmera de videomonitoramento','Resolução','Visão noturna (sim/não)','Guarda Municipal'],balanca:['Balança de caminhão','Capacidade (t)','Aferição (data)','Trânsito'],auto:['Veículo autônomo de fiscalização','Autonomia (h)','Área de patrulha','Mobilidade urbana'],cancela:['Cancela automatizada','Tipo de acesso','Controle (tag/QR/manual)','Mobilidade urbana'],transp:['Veículo de transporte','Categoria (táxi, mototáxi, escolar)','Placa','Mobilidade urbana'],totem:['Totem de estacionamento','Meios de pagamento','Vagas atendidas','Mobilidade urbana'],patinete:['Patinete elétrico','Bateria (%)','Operadora','Mobilidade urbana'],moto:['Moto de agente de trânsito','Placa','Prefixo','Trânsito'],viatura:['Viatura GM/PM','Prefixo','Placa','Polícia Militar']};
// Regras de negócio configuráveis (usadas por alertas, regiões e previsão)
const CFG={disp:[90,80,65],dias:7}; // região: disponibilidade < 90% = atenção, < 80% = elevado, < 65% = crítico; manutenção "próxima" = até 7 dias
const NIV=['Normal','Atenção','Elevado','Crítico'],COR=['var(--ok)','var(--at)','var(--hi)','var(--cr)'];
const iso=d=>d.toISOString().slice(0,10),addD=n=>new Date(Date.now()+n*864e5);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seed(){const r=rng(7),p=a=>a[Math.floor(r()*a.length)],eq=[],ag=[],ks=Object.keys(T);
 for(let i=0;i<64;i++){const k=p(ks),b=Math.floor(r()*5),s=r(),sit=s<.66?'oper':s<.76?'mau':s<.82?'manut':s<.86?'desat':s<.9?'furt':'nova',imm=sit==='mau',agd=!imm&&r()<.5,hm=[];
  for(let j=Math.floor(r()*4);j>0;j--)hm.push({data:iso(addD(-Math.floor(r()*300)-10)),obs:p(['Revisão periódica','Troca de peça','Calibração','Reparo elétrico'])});
  eq.push({id:i+1,tipo:k,serie:'FOGO-'+(1000+i),marca:p(['Siemens','Intelbras','Hikvision','Perkons','Honda','Yamaha']),modelo:'M'+Math.floor(r()*900+100),cep:'170'+(10+b)+'-'+Math.floor(r()*900+100),bairro:BA[b][0],cidade:'Marília/SP',rua:p(['Av. Sampaio Vidal','Rua Bahia','Av. Brasil','Rua São Luiz','Av. Rio Branco','Rua Paraná']),ref:p(['número 181','oposto ao número 181','S/N','em frente ao Mercado do Tio','KM 203']),lat:+(BA[b][1]+(r()-.5)*.03).toFixed(5),lng:+(BA[b][2]+(r()-.5)*.03).toFixed(5),sit,manut:imm?'imediata':agd?'agendada':'nenhuma',prox:agd?iso(addD(Math.floor(r()*45)-6)):'',org:T[k][3],x1:k==='radar'?'velocidade':k==='camera'?'Full HD':'',x2:k==='radar'?'60':k==='camera'?'sim':'',hm,at:new Date(Date.now()-Math.floor(r()*7e6)).toISOString()})}
 ['Ana Souza','Bruno Lima','Carla Dias','Diego Reis','Elisa Prado','Fábio Nunes','Gisele Melo','Hugo Alves','Irene Costa','João Pires','Karen Lopes','Lucas Rocha','Marta Silva','Nilo Faria'].forEach((n,i)=>{const b=i%5;ag.push({id:i+1,nome:n,mat:'A'+(2000+i),org:ORG[i%3],cargo:CARGOS[i%3],bairro:BA[b][0],st:r()<.75?'ativo':'folga',lat:+(BA[b][1]+(r()-.5)*.02).toFixed(5),lng:+(BA[b][2]+(r()-.5)*.02).toFixed(5),veic:'',at:new Date(Date.now()-Math.floor(r()*3e6)).toISOString()})});
 return{eq,ag}}
let S;try{S=JSON.parse(localStorage.getItem('fogo3'))}catch(e){}if(!S||!S.eq||!S.ag)S=seed();
const save=()=>{try{localStorage.setItem('fogo3',JSON.stringify(S))}catch(e){}};
// ---------- cálculos (única fonte de verdade: S.eq e S.ag) ----------
const dleft=e=>e.prox?Math.round((new Date(e.prox)-new Date(iso(new Date())))/864e5):null;
// estado de manutenção: imediata | vencida | proxima | agendada | nenhuma
const mst=e=>{if(e.sit==='nova')return'nenhuma';if(e.manut==='imediata')return'imediata';if(e.manut==='agendada'&&e.prox){const d=dleft(e);return d<0?'vencida':d<=CFG.dias?'proxima':'agendada'}return'nenhuma'};
const MST={imediata:'Imediata',vencida:'Vencida',proxima:'Próxima do vencimento',agendada:'Agendada',nenhuma:'Sem pendência'};
// Disponibilidade = operacionais ÷ instalados. "Ainda não instalado" não entra no denominador.
// Total = operacionais + indisponíveis (mau funcionamento, manutenção, desativado, furtado) + não instalados.
function stats(eq){const nova=eq.filter(e=>e.sit==='nova').length,op=eq.filter(e=>e.sit==='oper').length,inst=eq.length-nova;return{tot:eq.length,inst,op,nova,ind:inst-op,pct:inst?Math.round(op/inst*1000)/10:null}}
function eqAlerts(){const a=[];S.eq.forEach(e=>{const m=mst(e),d=dleft(e);let x=null;
 if(e.sit==='furt')x=[3,'Furtado','Registrado como furtado'];
 else if(m==='imediata')x=e.sit==='mau'?[3,'Mau funcionamento','Mau funcionamento com manutenção imediata']:[2,'Manutenção imediata','Marcado para manutenção imediata'];
 else if(e.sit==='mau')x=[2,'Mau funcionamento','Mau funcionamento sem manutenção marcada'];
 else if(m==='vencida')x=[2,'Manutenção vencida','Venceu há '+(-d)+' d ('+e.prox+')'];
 else if(m==='proxima')x=[1,'Manutenção próxima','Vence em '+d+' d ('+e.prox+')'];
 else if(e.sit==='desat')x=[1,'Desativado','Equipamento desativado'];
 if(x)a.push({sev:x[0],cat:x[1],motivo:x[2],e,bairro:e.bairro,d:d===null?999:d})});return a}
function regLv(n){const s=stats(S.eq.filter(e=>e.bairro===n));if(!s.inst)return 0;const c=eqAlerts().filter(x=>x.sev>=2&&x.bairro===n).length;return s.pct<CFG.disp[2]?3:s.pct<CFG.disp[1]?2:(s.pct<CFG.disp[0]||c>=3)?1:0}
function alerts(){const a=eqAlerts();BA.forEach(b=>{const l=regLv(b[0]),s=stats(S.eq.filter(e=>e.bairro===b[0]));if(l>=2)a.push({sev:l,cat:'Região',motivo:'Disponibilidade '+s.pct+'% (limite de atenção '+CFG.disp[1]+'%)',e:null,bairro:b[0],d:-1})});return a.sort((p,q)=>q.sev-p.sev||p.d-q.d)}
const tg=(l,c,i)=>`<span class="tg" style="color:${c}">${i?ic(i,13):''}${esc(l)}</span>`;
const tm=iso=>iso?new Date(iso).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'—';
// ---------- 1ª parte: inventário ----------
const lab=(f,v)=>f==='tipo'?T[v][0]:f==='sit'?SIT[v][0]:f==='manut'?MST[v==='nenhuma'?'nenhuma':v]||v:v;
const FE=[['tipo','Tipo de equipamento','sel',Object.keys(T)],['serie','Nº de série'],['marca','Marca'],['modelo','Modelo'],['cep','CEP'],['bairro','Bairro/região','sel',BA.map(b=>b[0])],['cidade','Cidade/UF'],['rua','Rua'],['ref','Referência'],['lat','Latitude','number'],['lng','Longitude','number'],['sit','Situação','sel',Object.keys(SIT)],['manut','Necessidade de manutenção','sel',['nenhuma','imediata','agendada']],['prox','Próxima manutenção','date'],['org','Órgão responsável','sel',ORG],['x1','Característica 1'],['x2','Característica 2']];
const FA=[['nome','Nome'],['mat','Matrícula'],['org','Órgão','sel',ORG],['cargo','Função','sel',CARGOS],['bairro','Base (região)','sel',BA.map(b=>b[0])],['st','Situação','sel',['ativo','folga']],['lat','Latitude','number'],['lng','Longitude','number'],['veic','Equipamento vinculado (nº de série)']];
const frm=(id,F,d)=>`<form id="${id}" class="frm" novalidate><input type="hidden" name="_id" value="${d.id||''}">${F.map(([k,l,t,o])=>`<label>${l}${t==='sel'?`<select name="${k}">${o.map(v=>`<option value="${v}"${d[k]===v?' selected':''}>${esc(lab(k,v))}</option>`).join('')}</select>`:`<input name="${k}" type="${t||'text'}" step="any" value="${esc(d[k])}">`}</label>`).join('')}<div class="full"><button class="btn p">Salvar</button><button type="reset" class="btn">Limpar formulário</button></div><div class="err full" role="alert"></div></form>`;
function inv(){const eq=S.eq,ag=S.ag;$('#m').innerHTML=`<div class="bar"><input class="q" id="iq" type="search" placeholder="Pesquisar por série, nome, matrícula, rua..." aria-label="Pesquisar"><button class="btn" id="ex">Exportar JSON</button><button class="btn" id="exc">Exportar CSV</button><label class="btn">Importar JSON <input type="file" id="im" accept=".json" hidden></label><button class="btn d" id="rs">Restaurar dados de exemplo</button></div><p class="rule">Os dados ficam salvos apenas neste navegador (localStorage). Para levar para outra máquina, use Exportar/Importar JSON.</p>
<div class="cols"><section class="card"><h2>Equipamentos (${eq.length})</h2>${frm('fe',FE,{tipo:'radar',cidade:'Marília/SP',sit:'nova',manut:'nenhuma',org:'Trânsito',bairro:'Centro',lat:BA[0][1],lng:BA[0][2]})}<div class="tb"><table><tr><th>Série<th>Tipo<th>Região<th>Situação<th></tr>${eq.map(e=>`<tr><td>${esc(e.serie)}<td>${ic(e.tipo,15)} ${esc(T[e.tipo][0])}<td>${esc(e.bairro)}<td>${tg(SIT[e.sit][0],SIT[e.sit][1],SIT[e.sit][2])}<td><button class="btn" data-ed="e${e.id}" aria-label="Editar">${ic('edit',14)}</button> <button class="btn d" data-rm="e${e.id}" aria-label="Remover">${ic('x',14)}</button></tr>`).join('')}</table></div></section>
<section class="card"><h2>Agentes (${ag.length})</h2>${frm('fa',FA,{org:'Trânsito',cargo:CARGOS[0],st:'ativo',bairro:'Centro',lat:BA[0][1],lng:BA[0][2]})}<div class="tb"><table><tr><th>Matrícula<th>Nome<th>Função<th>Situação<th></tr>${ag.map(a=>`<tr><td>${esc(a.mat)}<td>${esc(a.nome)}<td>${esc(a.cargo||a.org)}<td>${a.st==='ativo'?'Em atividade':'Folga'}<td><button class="btn" data-ed="a${a.id}" aria-label="Editar">${ic('edit',14)}</button> <button class="btn d" data-rm="a${a.id}" aria-label="Remover">${ic('x',14)}</button></tr>`).join('')}</table></div></section></div>`;
 const rd=f=>Object.fromEntries(new FormData(f));

function pred(){const rk=risk(),an=anom(),DN=['dom','seg','ter','qua','qui','sex','sáb'],hh=h=>String(h).padStart(2,'0')+'h';let mx=0;for(let w=0;w<7;w++)for(let h=0;h<24;h++)mx=Math.max(mx,ex(pb,w,h));
 const rec=S.eq.filter(e=>(e.hm||[]).length>=2).sort((a,b)=>b.hm.length-a.hm.length).slice(0,6);
 $('#m').innerHTML=`<p class="rule">Estimativas demonstrativas calculadas por regras estatísticas simples sobre 90 dias de histórico simulado e sobre o estado atual dos equipamentos. Não são probabilidades calibradas.</p>
 <div class="card"><h3>Risco nas próximas 24 h e distribuição de equipes</h3><table><tr><th>Região<th>Risco<th class="n">vs. normal<th>Pico esperado<th class="n">Agentes ativos<th>Recomendação</tr>${rk.map(r=>`<tr><td>${r.nome}<td>${tg(NIV[r.lvl],COR[r.lvl],r.lvl>1?'alerta':'ok')}<td class="n">${r.ratio.toFixed(2)}×<td>${hh(r.ph)} (${r.pk.toFixed(2)} ocorr./h)<td class="n">${r.have}<td>${r.have<r.need?`Reforçar +${r.need-r.have} agente(s) perto das ${hh(r.ph)}`:'Efetivo suficiente'}${r.un>.25?'. Priorizar reparo: '+Math.round(r.un*100)+'% dos instalados indisponíveis':''}</tr>`).join('')}</table>
 <p class="note"><b>Por quê:</b> ocorrências esperadas nas próximas 24 h (média ponderada dos últimos 90 dias, mesmo dia da semana e hora, dias recentes pesam mais) × (1 + 0,8 × % indisponível + 0,4 × % com manutenção pendente), dividido pela média diária da região. Níveis: &lt;1,05 normal, &lt;1,3 atenção, &lt;1,6 elevado, acima crítico. Agentes necessários = ⌈pico × 3 × (1 + % indisponível)⌉. <b>Limitação:</b> o coeficiente 3 é uma premissa de demonstração.</p></div>
 <div class="card"><h3>Comportamento fora do padrão e tendência</h3><table><tr><th>Região<th class="n">Média normal/dia<th class="n">Últimos 3 dias<th class="n">Desvio (z)<th>Tendência 14 d<th>Situação</tr>${an.map(a=>`<tr><td>${a.nome}<td class="n">${a.m.toFixed(1)}<td class="n">${a.last.toFixed(1)}<td class="n">${a.z.toFixed(1)}<td>${a.sl>.15?'Subindo':a.sl<-.15?'Caindo':'Estável'}<td>${a.z>2?tg('Fora do padrão',COR[3],'alerta'):a.z>1?tg('Atenção',COR[1],'alerta'):tg('Normal',COR[0],'ok')}</tr>`).join('')}</table><p class="note"><b>Por quê:</b> z = (média dos últimos 3 dias − média dos 30 dias anteriores) ÷ desvio padrão. z &gt; 2 sinaliza comportamento fora do padrão; a tendência é o coeficiente angular de uma regressão linear dos últimos 14 dias.</p></div>
 <div class="card"><h3>Equipamentos com manutenção recorrente</h3><table><tr><th>Equipamento<th>Região<th class="n">Manutenções registradas<th>Último registro<th>Situação</tr>${rec.map(e=>`<tr><td>${ic(e.tipo,14)} ${esc(T[e.tipo][0]+' '+e.serie)}<td>${e.bairro}<td class="n">${e.hm.length}<td>${e.hm.slice(-1)[0].data}<td>${tg(SIT[e.sit][0],SIT[e.sit][1],SIT[e.sit][2])}</tr>`).join('')||'<tr><td colspan="5">Sem equipamentos com 2 ou mais manutenções.</td></tr>'}</table><p class="note"><b>Por quê:</b> lista quem tem 2 ou mais manutenções no histórico cadastrado; use para decidir substituição ou revisão preventiva.</p></div>
 <div class="card"><h3>Mapa de calor semanal</h3><div class="bar"><select id="pbs" aria-label="Região">${BA.map((b,i)=>`<option value="${i}"${i===pb?' selected':''}>${b[0]}</option>`).join('')}</select></div><div style="overflow:auto"><table class="hm"><tr><td>${Array.from({length:24},(_,h)=>`<td>${h}`).join('')}</tr>${DN.map((n,w)=>`<tr><td>${n}${Array.from({length:24},(_,h)=>{const v=ex(pb,w,h);return`<td style="background:rgba(76,155,232,${(v/mx*.9).toFixed(2)})" title="${n} ${h}h: ${v.toFixed(2)} ocorr. esperadas">${v/mx>.6?v.toFixed(1):''}</td>`}).join('')}</tr>`).join('')}</table></div><p class="note">Cor mais forte = mais ocorrências esperadas naquele dia e hora (números nas células de maior concentração).</p></div>`;
 $('#pbs').onchange=e=>{pb=+e.target.value;pred()}}
// ---------- navegação e telemetria simulada ----------
const V={central,inv,pred},NAV=[['central','painel','Central de operações'],['inv','lista','Inventário'],['pred','graf','Cidade preditiva']];let view='central';
$('#nv').innerHTML=NAV.map(n=>`<button data-v="${n[0]}">${ic(n[1],16)} ${n[2]}</button>`).join('');
function go(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#m').onclick=null;V[v]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
setInterval(()=>{if(!$('#live').checked)return;const e=S.eq[Math.floor(Math.random()*S.eq.length)];
 if(Math.random()<.35&&e.sit!=='nova'){e.sit=e.sit==='oper'?(Math.random()<.5?'mau':'furt'):'oper';e.manut=e.sit==='mau'?'imediata':'nenhuma';e.at=new Date().toISOString()}
 S.ag.forEach(a=>{a.lat=+(a.lat+(Math.random()-.5)*.002).toFixed(5);a.lng=+(a.lng+(Math.random()-.5)*.002).toFixed(5);a.at=new Date().toISOString()});save();if(view==='central')upd()},4000);
go('central');
</script></body></html>
